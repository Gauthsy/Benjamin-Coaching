<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,follow"/>
  <meta name="theme-color" content="#050B16"/>
  <title>Page introuvable | Ben Fit Paris</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20"/>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%, rgba(49,86,255,.16), transparent 24%),linear-gradient(180deg,#050913 0%,#081225 45%,#07101f 100%);color:#F5F7FF;font-family:Arial,sans-serif;text-align:center}
    .wrap{max-width:620px;padding:34px 28px;border:1px solid rgba(144,167,255,.16);border-radius:32px;background:linear-gradient(180deg,rgba(10,22,42,.72),rgba(7,20,38,.94));box-shadow:0 24px 64px rgba(0,0,0,.26)}
    .code{margin:0;color:#A9B9FF;font-size:clamp(72px,20vw,160px);font-weight:900;line-height:.8}
    .kicker{margin:28px 0 8px;font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#A9B9FF}
    .text{margin:0 auto 28px;max-width:480px;color:rgba(239,243,255,.72);line-height:1.65}
    .btn{display:inline-flex;min-height:48px;align-items:center;padding:0 22px;border-radius:999px;background:linear-gradient(135deg,#3156FF,#3B61FF);color:#fff;font-size:12px;font-weight:800;letter-spacing:.16em;text-decoration:none;text-transform:uppercase;box-shadow:0 18px 34px rgba(25,54,160,.28)}
    .btn:focus-visible{outline:2px solid #F4F4F4;outline-offset:5px}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <p class="kicker">Page introuvable</p>
    <p class="text">Cette page n’existe pas ou a été déplacée. Reviens à l’accueil pour découvrir les coachings Ben Fit Paris.</p>
    <a class="btn" href="/">Retour à l’accueil</a>
  </main>
</body>
</html>
